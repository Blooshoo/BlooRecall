[project]
name = "bloorecall"
version = "1.0.0"
description = "Local hybrid file locator (BM25 + local dense embeddings) with an MCP server"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "mcp>=1.2"]

[project.scripts]
bloorecall = "bloorecall.cli:main"

[tool.setuptools]
packages = ["bloorecall"]
